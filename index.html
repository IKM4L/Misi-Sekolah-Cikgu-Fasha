alan'],ans:0,tip:'Hebat! Hari persekolahan selesai.'}];
const q2=[['Pilih kata majmuk yang betul.',['kereta api','keretaapi','kereta-api'],0],['Yang manakah kata kerja?',['menyapu','cantik','sekolah'],0],['Pilih ayat tunggal.',['Ali membaca buku.','Ali membaca dan Siti menulis.','Ali makan lalu tidur.'],0],['Kata hubung dalam ayat “Aina dan Ali belajar” ialah...',['belajar','dan','Aina'],1],['Pilih kata adjektif.',['tinggi','berlari','sekolah'],0],['Kata nama khas yang betul ialah...',['kuala lumpur','Kuala Lumpur','kuala Lumpur'],1],['Pilih kata ganti nama diri.',['saya','meja','hijau'],0],['Ayat tanya diakhiri dengan...',['tanda noktah','tanda soal','tanda koma'],1],['Pilih ejaan yang betul.',['perpustakaan','perpustakan','perpustakaaan'],0],['“Buku itu ___ atas meja.”',['di','ke','dari'],0],['Kata majmuk bagi “jam” dan “tangan” ialah...',['jam tangan','jamtangan','jam-tangan'],0],['“Ibu ___ nasi.”',['memasak','cantik','merah'],0]];
const q4=[['Pilih ayat aktif.',['Ibu memasak nasi.','Nasi dimasak oleh ibu.','Buku itu dibaca oleh Ali.'],0],['Pilih ayat pasif.',['Ali menendang bola.','Bola ditendang oleh Ali.','Siti menyanyi.'],1],['Penjodoh bilangan untuk pisang ialah...',['sebiji','sesikat','sehelai'],1],['Simpulan bahasa “ringan tulang” bermaksud...',['rajin membantu','suka tidur','mudah marah'],0],['Pilih imbuhan awalan yang betul.',['bermain','mainber','mainanber'],0],['“Walaupun hujan, mereka ___ hadir.”',['tetap','atau','kerana'],0],['Ayat majmuk menggunakan...',['kata hubung','kata tanya sahaja','satu perkataan'],0],['Kata adjektif perasaan ialah...',['gembira','kerusi','berlari'],0],['Pilih peribahasa yang betul.',['bagai aur dengan tebing','bagai aur dengan buku','bagai aur dengan awan'],0],['Kata kerja transitif memerlukan...',['objek','warna','tanda soal'],0],['“Hadiah itu diberikan ___ guru.”',['oleh','dari','di'],0],['Pilih kata majmuk.',['alat tulis','alattulis','alat-tulis'],0]];
const q6=[['Pembentukan Malaysia diisytiharkan pada...',['16 September 1963','31 Ogos 1957','16 September 1957'],0],['Tokoh yang mengemukakan gagasan Malaysia pada 1961 ialah...',['Tunku Abdul Rahman','Hang Tuah','Tun Perak'],0],['Negeri yang dikenali sebagai Negeri di Bawah Bayu ialah...',['Sabah','Perlis','Melaka'],0],['Sarawak terletak di...',['Pulau Borneo','Pulau Langkawi','Pulau Pinang'],0],['Rukun Negara mempunyai berapa prinsip?',['Lima','Tiga','Tujuh'],0],['Prinsip pertama Rukun Negara ialah...',['Kepercayaan kepada Tuhan','Kesopanan dan Kesusilaan','Kedaulatan Undang-undang'],0],['Bendera Malaysia dikenali sebagai...',['Jalur Gemilang','Sang Saka','Bintang Timur'],0],['Bunga kebangsaan Malaysia ialah...',['Bunga raya','Bunga mawar','Bunga melur'],0],['Lagu kebangsaan Malaysia ialah...',['Negaraku','Tanggal 31','Warisan'],0],['Bahasa kebangsaan Malaysia ialah...',['Bahasa Melayu','Bahasa Jepun','Bahasa Perancis'],0],['ASEAN ialah pertubuhan negara-negara...',['Asia Tenggara','Eropah','Amerika Selatan'],0],['Sambutan Hari Malaysia ialah pada...',['16 September','1 Januari','1 Mei'],0],['Sukan SEA melibatkan negara-negara...',['Asia Tenggara','Afrika','Eropah'],0],['Tokoh sukan Malaysia terkenal dalam badminton ialah...',['Lee Chong Wei','Parameswara','Tun Perak'],0],['Menghormati lambang negara menunjukkan sikap...',['patriotisme','mementingkan diri','lalai'],0]];
function bank(){return profile.year==='2'?q2:profile.year==='4'?q4:q6}function pickQuestion(){let q=bank()[Math.floor(Math.random()*bank().length)],idx=[0,1,2].sort(()=>Math.random()-.5);return{q:q[0],opts:idx.map(i=>q[1][i]),ans:idx.indexOf(q[2])}};
const $=s=>document.querySelector(s);function persist(){localStorage.setItem(saveKey,JSON.stringify({name:profile.name,year:profile.year,gender:profile.gender,done:[...completed],xp,coins}))}function panel(html){modal=true;paused=true;$('#overlay').classList.remove('hidden');$('#panel').innerHTML=html}function close(){modal=false;paused=false;$('#overlay').classList.add('hidden')}function toast(s){$('#toast').textContent=s;$('#toast').style.display='block';toastUntil=performance.now()+2300}function beep(freq=600){if(!sound)return;try{let ac=window.__ac||(window.__ac=new(window.AudioContext||window.webkitAudioContext)()),o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.045,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.12);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+.13)}catch{}}
function intro(){panel(`<div class="big">🏫🎒</div><h1>MISI SEKOLAH<br>CIKGU FASHA</h1><span class="tag">🌈 Pengembaraan dari rumah ke sekolah</span><p>Jadi murid yang rajin! Teroka kawasan sekolah, jumpa guru, jawab soalan dan kumpul bintang.</p><label>Nama pemain</label><input id="name" maxlength="24" placeholder="Nama murid" value="${escapeHtml(profile.name)}"><label>Tahun / Mata Pelajaran</label><select id="year"><option value="2" ${profile.year==='2'?'selected':''}>Tahun 2 · Bahasa Melayu</option><option value="4" ${profile.year==='4'?'selected':''}>Tahun 4 · Bahasa Melayu</option><option value="6" ${profile.year==='6'?'selected':''}>Tahun 6 · Sejarah</option></select><label>Watak</label><select id="gender"><option value="girl" ${profile.gender==='girl'?'selected':''}>👧 Murid perempuan</option><option value="boy" ${profile.gender==='boy'?'selected':''}>👦 Murid lelaki</option></select><button class="btn" id="start">▶ JOM KE SEKOLAH!</button><p class="note">Kawalan: WASD / anak panah / butang skrin. Tekan E atau BUAT TUGAS apabila dekat ikon misi.</p>`);$('#start').onclick=()=>{profile={name:$('#name').value.trim()||'Murid Bijak',year:$('#year').value,gender:$('#gender').value};persist();close();toast('🏠 Mulakan hari dengan bersiap ke sekolah!')}}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function mission(p){if(!p){toast('Dekati ikon misi untuk berinteraksi!');return}if(completed.has(p.id)){toast('✅ Misi ini sudah selesai!');return}if(p.quiz){let q=pickQuestion();ask(p,q)}else ask(p,{q:p.task,opts:p.opts,ans:p.ans})}
function ask(p,q){panel(`<div class="big">${p.icon}</div><span class="tag">📍 ${p.area}</span><h2>${p.name}</h2><p style="font-weight:800">${q.q}</p><div id="answers">${q.opts.map((o,i)=>`<button class="option" data-answer="${i}"><b>${'ABC'[i]}.</b> ${escapeHtml(o)}</button>`).join('')}</div><p class="note">Pilih jawapan yang paling tepat.</p><button class="btn secondary" id="later">Nanti dahulu</button>`);$('#later').onclick=close;document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{let correct=+b.dataset.answer===q.ans;beep(correct?780:220);if(correct){completed.add(p.id);xp+=100;coins+=5;persist();panel(`<div class="big">🎉</div><h2>Syabas, ${escapeHtml(profile.name)}!</h2><p>${escapeHtml(p.tip||'Jawapan tepat! Kamu telah menyelesaikan satu misi pembelajaran.')}</p><p class="tag">+100 XP ⭐ &nbsp; +5 Syiling 🪙</p><p>${completed.size}/${places.length} misi selesai</p><button class="btn" id="continue">Teruskan Pengembaraan ➜</button>`);$('#continue').onclick=()=>{close();if(completed.size===places.length)finish()}}else{b.style.background='#ffe0dc';b.textContent='❌ Cuba lagi! '+b.textContent;setTimeout(()=>{if(!modal)return;b.style.background='white'},650)}});
}function finish(){panel(`<div class="big">🏆</div><h1>TAHNIAH!</h1><p>Kamu telah menyelesaikan semua misi di sekolah!</p><h2>${escapeHtml(profile.name)} · ${xp} XP</h2><button class="btn" id="again">Main Semula</button>`);$('#again').onclick=()=>{completed.clear();xp=0;coins=0;player.x=245;player.y=1345;persist();close()}}
function bag(){panel(`<div class="big">🎒</div><h2>Beg Sekolah</h2><p><b>${escapeHtml(profile.name)}</b> · Tahun ${profile.year}</p><p>⭐ ${xp} XP &nbsp; 🪙 ${coins} Syiling</p><div class="progress"><div style="width:${completed.size/places.length*100}%"></div></div><p>${completed.size}/${places.length} misi selesai</p><div style="text-align:left">${places.map(p=>`<p>${completed.has(p.id)?'✅':'⬜'} ${p.icon} ${p.name}</p>`).join('')}</div><button class="btn" id="back">Kembali</button><button class="btn secondary" id="restart">Mula Baharu</button>`);$('#back').onclick=close;$('#restart').onclick=()=>{if(confirm('Padam kemajuan dan mula semula?')){completed.clear();xp=0;coins=0;player.x=245;player.y=1345;persist();close()}}}
function mapModal(){panel(`<h2>🗺️ Peta Misi Sekolah</h2><p>Teroka dunia menggunakan butang arah. Cari ikon bercahaya untuk melakukan tugasan.</p>${places.map(p=>`<p style="text-align:left">${completed.has(p.id)?'✅':'📍'} ${p.icon} <b>${p.area}</b> — ${p.name}</p>`).join('')}<button class="btn" id="back">Sambung Bermain</button>`);$('#back').onclick=close}
$('#mapbtn').onclick=mapModal;$('#bagbtn').onclick=bag;$('#soundbtn').onclick=()=>{sound=!sound;$('#soundbtn').textContent=sound?'🔊':'🔇'};$('#pausebtn').onclick=()=>panel(`<h2>⏸️ Permainan Dijeda</h2><p>Ambil rehat sebentar.</p><button class="btn" id="resume">Sambung</button><button class="btn secondary" id="home">Menu Utama</button>`);document.addEventListener('click',e=>{if(e.target.id==='resume')close();if(e.target.id==='home')intro()});$('#action').onclick=()=>mission(near);addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();keys.add(e.key.toLowerCase());if(e.key.toLowerCase()==='e'&&!modal)mission(near)});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));document.querySelectorAll('[data-dir]').forEach(b=>{let k=b.dataset.dir;b.addEventListener('pointerdown',e=>{e.preventDefault();keys.add(k);b.setPointerCapture(e.pointerId)});for(let ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>keys.delete(k))});

function drawCharacter(x,y,gender=profile.gender,phase=0){ctx.save();ctx.translate(x,y);ctx.fillStyle='#29324b33';ctx.beginPath();ctx.ellipse(0,23,22,8,0,0,7);ctx.fill();let bounce=Math.sin(phase)*2;ctx.translate(0,bounce);ctx.strokeStyle='#29324b';ctx.lineWidth=4;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-8,14);ctx.lineTo(-10,23);ctx.moveTo(8,14);ctx.lineTo(10,23);ctx.stroke();rect(-15,-11,30,30,gender==='girl'?'#a8d9f6':'#f5f5ee','#29324b',6);ctx.fillStyle='#26304b';ctx.beginPath();ctx.arc(0,-23,18,0,7);ctx.fill();ctx.fillStyle='#f4c79f';ctx.beginPath();ctx.arc(0,-22,14,0,7);ctx.fill();ctx.fillStyle='#29324b';ctx.beginPath();ctx.arc(-5,-24,2,0,7);ctx.arc(5,-24,2,0,7);ctx.fill();ctx.strokeStyle='#8e4c48';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(0,-20,4,0,Math.PI);ctx.stroke();ctx.fillStyle='#fdfdfd';ctx.fillRect(-14,-41,28,8);ctx.fillStyle='#385d9c';ctx.fillRect(-14,-34,28,4);ctx.restore()}
function drawMissions(t){for(let p of places){if(completed.has(p.id))continue;let bob=Math.sin(t/450+p.x)*5;ctx.fillStyle='#ffd05a55';ctx.beginPath();ctx.arc(p.x,p.y-35+bob,34,0,7);ctx.fill();ctx.strokeStyle='#ffbf3d';ctx.lineWidth=4;ctx.stroke();emoji(p.icon,p.x,p.y-25+bob,32);text('!',p.x+24,p.y-48+bob,20,'#db684c')}}function draw(){ctx.clearRect(0,0,cw,ch);ctx.save();ctx.translate(-camera.x,-camera.y);drawWorld();drawMissions(performance.now());drawCharacter(player.x,player.y,profile.gender,player.step);ctx.restore();mc.clearRect(0,0,140,140);mc.fillStyle='#9bd6a2';mc.fillRect(0,0,140,140);mc.fillStyle='#f4d8b1';mc.fillRect(65,25,70,70);mc.fillStyle='#65788c';mc.fillRect(0,90,140,11);for(let p of places){mc.fillStyle=completed.has(p.id)?'#35a779':'#efb64b';mc.beginPath();mc.arc(p.x/W*140,p.y/H*140,3.5,0,7);mc.fill()}mc.fillStyle='#2e4bb3';mc.beginPath();mc.arc(player.x/W*140,player.y/H*140,5,0,7);mc.fill()}
function tick(t){let dt=Math.min((t-last)/1000||0,.04);last=t;if(!paused){let dx=0,dy=0;if(keys.has('arrowup')||keys.has('w')||keys.has('up'))dy--;if(keys.has('arrowdown')||keys.has('s')||keys.has('down'))dy++;if(keys.has('arrowleft')||keys.has('a')||keys.has('left'))dx--;if(keys.has('arrowright')||keys.has('d')||keys.has('right'))dx++;let l=Math.hypot(dx,dy)||1;player.x=Math.max(45,Math.min(W-45,player.x+dx/l*240*dt));player.y=Math.max(55,Math.min(H-40,player.y+dy/l*240*dt));if(dx||dy)player.step+=dt*13;minutes+=dt*.7;camera.x=Math.max(0,Math.min(W-cw,player.x-cw/2));camera.y=Math.max(0,Math.min(H-ch,player.y-ch/2));near=places.filter(p=>!completed.has(p.id)).sort((a,b)=>Math.hypot(player.x-a.x,player.y-a.y)-Math.hypot(player.x-b.x,player.y-b.y))[0];if(near&&Math.hypot(player.x-near.x,player.y-near.y)>110)near=null;$('#objective').textContent=near?`✨ Dekat ${near.name} — tekan BUAT TUGAS!`:`🎯 ${completed.size}/${places.length} misi • Teroka kawasan sekolah dan cari ikon bercahaya`;$('#score').textContent=`⭐ ${xp} XP`;let hour=Math.floor(minutes/60)%12||12,min=Math.floor(minutes%60);$('#clock').textContent=`☀️ ISN ${hour}:${String(min).padStart(2,'0')} PG`;$('#action').style.opacity=near?'1':'.75'}draw();if(t>toastUntil)$('#toast').style.display='none';requestAnimationFrame(tick)}intro();requestAnimationFrame(tick);
</script></body></html>
